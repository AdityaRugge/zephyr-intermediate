name: Zephyr CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Zephyr App
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        board:
          - qemu_x86
          - nucleo_f401re/stm32f401xe
          - nucleo_f746zg/stm32f746xx

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West
        run: pip install west pyelftools

      - name: Initialize West workspace
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Install Zephyr Python requirements
        run: pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          ZEPHYR_SDK_VERSION=0.17.0
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz -O /tmp/zephyr-sdk.tar.xz
          mkdir -p $HOME/zephyr-sdk
          tar -xf /tmp/zephyr-sdk.tar.xz -C $HOME/zephyr-sdk --strip-components=1
          $HOME/zephyr-sdk/setup.sh -t x86_64-zephyr-elf -t arm-zephyr-eabi -h -c

      - name: Build for ${{ matrix.board }}
        run: |
          source zephyr/zephyr-env.sh
          west build -p always -b ${{ matrix.board }} app --build-dir build/${{ matrix.board }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-${{ strategy.job-index }}-build
          path: |
            build/${{ matrix.board }}/zephyr/zephyr.elf
            build/${{ matrix.board }}/zephyr/zephyr.bin
            build/${{ matrix.board }}/zephyr/zephyr.hex
          if-no-files-found: warn

  simulate:
    name: Simulate on QEMU
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West
        run: pip install west pyelftools

      - name: Initialize West workspace
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Install Zephyr Python requirements
        run: pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          ZEPHYR_SDK_VERSION=0.17.0
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz -O /tmp/zephyr-sdk.tar.xz
          mkdir -p $HOME/zephyr-sdk
          tar -xf /tmp/zephyr-sdk.tar.xz -C $HOME/zephyr-sdk --strip-components=1
          $HOME/zephyr-sdk/setup.sh -t x86_64-zephyr-elf -h -c

      - name: Install QEMU
        run: sudo apt-get install -y qemu-system-x86

      - name: Build for QEMU
        run: |
          source zephyr/zephyr-env.sh
          west build -p always -b qemu_x86 app --build-dir build/qemu_x86

      - name: Run on QEMU and capture output
        run: |
          source zephyr/zephyr-env.sh
          timeout 15s west build -t run --build-dir build/qemu_x86 2>&1 | tee qemu_output.txt || true

      - name: Verify all 4 threads started
        run: |
          echo "=== QEMU Output ==="
          cat qemu_output.txt
          PASS=0
          grep -q "T_HIGH RUNNING"  qemu_output.txt && echo "✅ T_HIGH found"  && PASS=$((PASS+1)) || echo "❌ T_HIGH not found"
          grep -q "T_MED RUNNING"   qemu_output.txt && echo "✅ T_MED found"   && PASS=$((PASS+1)) || echo "❌ T_MED not found"
          grep -q "T_LOW RUNNING"   qemu_output.txt && echo "✅ T_LOW found"   && PASS=$((PASS+1)) || echo "❌ T_LOW not found"
          grep -q "T_Coop RUNNING"  qemu_output.txt && echo "✅ T_Coop found"  && PASS=$((PASS+1)) || echo "❌ T_Coop not found"
          echo "$PASS/4 threads verified"
          [ $PASS -eq 4 ] && exit 0 || exit 1

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: qemu-output-log
          path: qemu_output.txt

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y clang-format cppcheck

      - name: Check formatting with clang-format
        run: |
          find app/src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

      - name: Run cppcheck static analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            app/src/
