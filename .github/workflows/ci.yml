cat > /home/aditya/Workspace/zephyr-intermediate/.github/workflows/ci.yml << 'EOF'
name: Zephyr CI

on:
  push:
    branches: [ main, master, 'Test_**' ]
  pull_request:
    branches: [ main, master, 'Test_**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gperf \
            python3-pip python3-venv python3-setuptools python3-wheel \
            gcc-arm-none-eabi device-tree-compiler ccache

      - name: Setup Python virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools west

      - name: Initialize west workspace and fetch Zephyr
        run: |
          . .venv/bin/activate
          west init -l .
          west update
          west zephyr-export

      - name: Debug workspace layout
        run: |
          . .venv/bin/activate
          echo "=== pwd ==="
          pwd
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE
          echo "=== ls .. ==="
          ls ..
          echo "=== west list ==="
          west list
          echo "=== find ZephyrConfig ==="
          find / -name "ZephyrConfig.cmake" 2>/dev/null | head -5
          echo "=== find zephyr-env ==="
          find / -name "zephyr-env.sh" 2>/dev/null | head -3
          echo "=== west config ==="
          west config --list

      - name: Install Zephyr Python requirements
        run: |
          . .venv/bin/activate
          ZEPHYR_PATH=$(west list zephyr -f '{abspath}')
          echo "Zephyr is at: $ZEPHYR_PATH"
          pip install -r "$ZEPHYR_PATH/scripts/requirements.txt"

      - name: Build all apps
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ZEPHYR_PATH=$(west list zephyr -f '{abspath}')
          echo "Zephyr path: $ZEPHYR_PATH"
          export ZEPHYR_BASE="$ZEPHYR_PATH"
          apps=$(git ls-files -- "app/CMakeLists.txt" "**/app/CMakeLists.txt" \
            | sed -E 's#/CMakeLists.txt##' | sort -u)
          if [ -z "$apps" ]; then
            echo "No app/ folders found"
            exit 1
          fi
          for d in $apps; do
            echo "Building: $d"
            west build -p always -b nucleo_f446re "$d" \
              -- -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-build-artifacts
          path: |
            **/build/zephyr/zephyr.elf
            **/build/zephyr/zephyr.bin
            **/build/zephyr/zephyr.hex
          if-no-files-found: warn

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y clang-format cppcheck

      - name: Check formatting with clang-format
        run: |
          find app/src -name "*.c" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

      - name: Run cppcheck static analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            app/src/
EOF