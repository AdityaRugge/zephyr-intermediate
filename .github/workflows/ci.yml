name: Zephyr CI

on:
  push:
    branches: [ main, master, 'Test_**' ]
  pull_request:
    branches: [ main, master, 'Test_**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gperf \
            python3-pip python3-venv python3-setuptools python3-wheel \
            gcc-arm-none-eabi device-tree-compiler ccache

      - name: Setup Python virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools

      - name: Install west
        run: |
          . .venv/bin/activate
          pip install west

      - name: Initialize west workspace and fetch Zephyr
        run: |
          . .venv/bin/activate
          west init -l .
          west update
          west zephyr-export

      - name: Install Zephyr Python requirements
        run: |
          . .venv/bin/activate
          pip install -r zephyr/scripts/requirements.txt

      - name: Build all apps
        run: |
          set -euo pipefail
          . .venv/bin/activate
          apps=$(git ls-files -- "app/CMakeLists.txt" "**/app/CMakeLists.txt" \
            | sed -E 's#/CMakeLists.txt##' | sort -u)
          if [ -z "$apps" ]; then
            echo "No app/ folders with CMakeLists.txt found"
            exit 1
          fi
          for d in $apps; do
            echo "=========================================="
            echo "Building: $d"
            echo "=========================================="
            west build -p always -b nucleo_f446re "$d" \
              -- -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-build-artifacts
          path: |
            **/build/zephyr/zephyr.elf
            **/build/zephyr/zephyr.bin
            **/build/zephyr/zephyr.hex
          if-no-files-found: warn

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y clang-format cppcheck

      - name: Check formatting with clang-format
        run: |
          find app/src -name "*.c" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

      - name: Run cppcheck static analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            app/src/