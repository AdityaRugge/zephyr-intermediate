name: Zephyr CI

on:
  push:
    branches: [ main, master, 'Test_**' ]
  pull_request:
    branches: [ main, master, 'Test_**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gperf \
            python3-pip python3-venv python3-setuptools python3-wheel \
            gcc-arm-none-eabi device-tree-compiler ccache

      - name: Setup Python virtualenv and install west
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools west

      - name: Initialize west workspace
        run: |
          . .venv/bin/activate
          west init -l .
          west update
          west zephyr-export

      - name: Show west workspace layout
        run: |
          . .venv/bin/activate
          echo "west list:"
          west list
          echo "zephyr path:"
          west list zephyr -f '{abspath}'
          echo "ZephyrConfig.cmake:"
          find / -name "ZephyrConfig.cmake" 2>/dev/null | head -5 || echo "not found"

      - name: Install Zephyr Python requirements
        run: |
          . .venv/bin/activate
          ZEPHYR_PATH=$(west list zephyr -f '{abspath}')
          pip install -r "$ZEPHYR_PATH/scripts/requirements.txt"

      - name: Build
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ZEPHYR_PATH=$(west list zephyr -f '{abspath}')
          export ZEPHYR_BASE="$ZEPHYR_PATH"
          echo "ZEPHYR_BASE=$ZEPHYR_BASE"
          apps=$(git ls-files -- "app/CMakeLists.txt" "**/app/CMakeLists.txt" \
            | sed -E 's#/CMakeLists.txt##' | sort -u)
          echo "Apps found: $apps"
          if [ -z "$apps" ]; then
            echo "No apps found"
            exit 1
          fi
          for d in $apps; do
            echo "Building: $d"
            west build -p always -b nucleo_f446re "$d" \
              -- -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-build-artifacts
          path: |
            **/build/zephyr/zephyr.elf
            **/build/zephyr/zephyr.bin
            **/build/zephyr/zephyr.hex
          if-no-files-found: warn

  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y clang-format cppcheck

      - name: Check formatting
        run: |
          find app/src -name "*.c" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

      - name: Static analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            app/src/
