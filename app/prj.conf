# ==========================================
# Logging Subsystem Configuration
# ==========================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=1000

# ==========================================
# Thread Management & Monitoring
# ==========================================
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# ==========================================
# Interactive Shell & Console
# ==========================================
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n

# ==========================================
# Stack Safety & Diagnostics
# ==========================================
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# ==========================================
# Console & Hardware Serial I/O
# ==========================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# (Removed the native PTY line completely)

# ==========================================
# System Tracing & Event Logging
# ==========================================
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
# Note: TRACING_BACKEND_POSIX is also a host-simulation feature. 
# If compiling for real hardware, you would typically swap or remove 
# the POSIX tracing backend depending on your hardware trace setup (e.g., SEGGER RTT).

# ==========================================
# Logging Backend Configuration
# ==========================================
CONFIG_LOG_BACKEND_UART=y

# ==========================================
# Application Stack Size
# ==========================================
CONFIG_MAIN_STACK_SIZE=2048