CONFIG_LOG=y
CONFIG_THREAD_NAME=y

CONFIG_NUM_COOP_PRIORITIES=1
CONFIG_NUM_PREEMPT_PRIORITIES=8

# Ensure console and printk are enabled so LOG_INF/printk output appears
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable the watchdog driver and configure it for 2 channels
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
# Enable hardware watchdog fallback if needed (e.g. if the task watchdog is not supported on the platform)
CONFIG_TASK_WDT_HW_FALLBACK=y