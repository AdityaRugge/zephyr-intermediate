# ==========================================
# Logging Subsystem Configuration
# ==========================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3          # Sets default log level to Info
CONFIG_LOG_MODE_DEFERRED=y          # Buffers logs asynchronously to prevent ISR blocking
CONFIG_LOG_RATELIMIT=y              # Enables log rate-limiting to prevent spam
CONFIG_LOG_RATELIMIT_INTERVAL_MS=1000 # Minimum interval between repeated logs (1 second)

# ==========================================
# Thread Management & Monitoring
# ==========================================
CONFIG_THREAD_NAME=y                # Enables descriptive names for threads
CONFIG_THREAD_MONITOR=y             # Tracks active threads for kernel inspection

# ==========================================
# Interactive Shell & Console
# ==========================================
CONFIG_SHELL=y                      # Enables Zephyr shell interface
CONFIG_KERNEL_SHELL=y               # Adds built-in kernel diagnostic commands
CONFIG_SHELL_BACKEND_SERIAL=y       # Routes shell through serial/UART backend
CONFIG_SHELL_LOG_BACKEND=n          # Disables direct logging feedback loops in shell

# ==========================================
# Stack Safety & Diagnostics
# ==========================================
CONFIG_INIT_STACKS=y                # Fills stacks with patterns at boot for overflow checks
CONFIG_THREAD_STACK_INFO=y          # Embeds stack bounds into thread control blocks

# ==========================================
# Console & Native POSIX Simulation I/O
# ==========================================
CONFIG_SERIAL=y                     # Enables serial driver subsystem
CONFIG_CONSOLE=y                    # Enables standard console output
CONFIG_UART_CONSOLE=y               # Connects console to UART driver
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y # Creates host PTY for native POSIX simulation targets

# ==========================================
# System Tracing & Event Logging
# ==========================================
CONFIG_TRACING=y                    # Enables kernel tracing framework
CONFIG_TRACING_CTF=y                # Records traces using Common Trace Format
CONFIG_TRACING_SYNC=y               # Synchronous trace output handling
CONFIG_TRACING_BACKEND_POSIX=y      # Uses POSIX backend for host-side trace collection
CONFIG_TRACING_PACKET_MAX_SIZE=64   # Sets maximum size for individual trace packets

# ==========================================
# Application Stack Size
# ==========================================
CONFIG_MAIN_STACK_SIZE=2048         # Allocates 2 KB stack memory for the main thread